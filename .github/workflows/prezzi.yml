name: Prezzi ETF Borsa Italiana

on:
  schedule:
    # UTC. Borsa chiude alle 17:30 ora italiana (15:30 UTC con l'ora legale, 16:30 con l'ora solare); il segnale serale gira alle 17:45 UTC.
    # Piu' orari perche' GitHub puo' ritardare o saltare uno schedule (il 9/9/2026 non e' partito nessuno dei due previsti).
    # Un run che non trova dati nuovi non produce commit (git diff --cached --quiet).
    - cron: "40 16 * * 1-5"
    - cron: "55 16 * * 1-5"
    - cron: "10 17 * * 1-5"
    - cron: "25 17 * * 1-5"
  workflow_dispatch:
    inputs:
      rigenera_mappa:
        description: "Azzera data/mappa_ticker.json e risolve di nuovo tutti gli ISIN (5-10 minuti)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prezzi
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas requests
      - name: Scarica le chiusure
        env:
          RIGENERA_MAPPA: ${{ inputs.rigenera_mappa == true && '1' || '0' }}
        run: python scarica_prezzi.py
      - name: Salva nel repository
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "prezzi $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin main
          git push
